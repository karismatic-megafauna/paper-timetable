[project]
name = "packbuilder"
version = "0.1.0"
description = "Turns GTFS schedule feeds into compact offline data packs"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
packbuilder = "packbuilder.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/packbuilder"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: downloads real feeds; run with -m network"]
addopts = "-m 'not network'"
